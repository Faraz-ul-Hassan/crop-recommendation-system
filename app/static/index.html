<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>🌱 Crop Recommendation System</h1>
            <p class="subtitle">
                Enter your soil and environmental conditions to get the recommended crop.
            </p>
        </header>

        <form id="crop-form" class="crop-form">
            <div class="field-grid">
                <div class="field">
                    <label for="N">Nitrogen (N) <span class="unit">mg/kg</span></label>
                    <input type="number" id="N" name="N" min="0" max="200" step="1" required />
                </div>
                <div class="field">
                    <label for="P">Phosphorus (P) <span class="unit">mg/kg</span></label>
                    <input type="number" id="P" name="P" min="0" max="200" step="1" required />
                </div>
                <div class="field">
                    <label for="K">Potassium (K) <span class="unit">mg/kg</span></label>
                    <input type="number" id="K" name="K" min="0" max="250" step="1" required />
                </div>
                <div class="field">
                    <label for="temperature">Temperature <span class="unit">°C</span></label>
                    <input type="number" id="temperature" name="temperature"
                           min="-10" max="60" step="0.1" required />
                </div>
                <div class="field">
                    <label for="humidity">Humidity <span class="unit">%</span></label>
                    <input type="number" id="humidity" name="humidity"
                           min="0" max="100" step="0.1" required />
                </div>
                <div class="field">
                    <label for="ph">Soil pH</label>
                    <input type="number" id="ph" name="ph"
                           min="0" max="14" step="0.1" required />
                </div>
                <div class="field">
                    <label for="rainfall">Rainfall <span class="unit">mm</span></label>
                    <input type="number" id="rainfall" name="rainfall"
                           min="0" max="500" step="0.1" required />
                </div>
            </div>

            <button type="submit" id="submit-btn">Recommend Crop</button>
            <p id="error-msg" class="error hidden"></p>
        </form>

        <section id="result" class="result hidden">
            <h2>Recommended Crop</h2>
            <div id="result-main" class="result-main"></div>
            <h3>Top 3 Predictions</h3>
            <div id="result-top3" class="result-top3"></div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
